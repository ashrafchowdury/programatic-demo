<!-- pair: your brand + one partner, no words. Integration, channel, model. Put the partner's official
     logo file in assets/ and keep data-third-party on its tile. -->
<main class="post paper" data-archetype="pair">
  <div style="left:50%;top:50%;transform:translate(-50%, -50%);display:flex;align-items:center;gap:calc(var(--u) * 6)">
    <div class="tile dark" data-logo="brand" style="position:relative;width:calc(var(--u) * 22);height:calc(var(--u) * 22)"><img src="{{brand}}/logos/mark-dark-accent.svg" alt="Logo" style="width:58%;height:auto"></div>
    <span style="font-size:calc(var(--u) * 9);line-height:1;color:var(--ink-3)">+</span>
    <div class="tile" data-third-party style="position:relative;width:calc(var(--u) * 22);height:calc(var(--u) * 22)"><img src="assets/partner.svg" alt="Partner" style="width:58%;height:auto"></div>
  </div>
</main>
