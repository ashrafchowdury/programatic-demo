<!-- window: the whole product, framed like a window onto real work, rising from the bottom edge over a textured paper ground
     (fibre grain and a soft top light). Headline above, centred. Lit (texture); optional. Feature launches with a real screen.
     From Perplexity's window posts (window top at 26 %H, spanning 7-95 %W, bleeding off the bottom; textured ground, never a photo). -->
<main class="post paper" data-archetype="window">
  <div data-light style="inset:0;background:radial-gradient(ellipse 70% 60% at 50% 0%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%), linear-gradient(180deg, var(--panel-2), var(--tint))"></div>
  <div data-light style="inset:0;opacity:0.5;mix-blend-mode:multiply;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.09' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.6  0 0 0 0 0.58  0 0 0 0 0.56  0.7 0 0 0 -0.28'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>&quot;)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:50%;top:17%;transform:translateX(-50%);text-align:center;white-space:nowrap">Every agent, one workspace.</h1>
  <div class="frame" style="left:7%;right:7%;top:35%;height:80%;display:grid;grid-template-columns:20% 1fr 26%;box-shadow:0 0 0 2px rgba(36,36,36,0.06), 0 40px 96px rgba(36,36,36,0.16)">
    <div style="background:var(--panel-2);border-right:2px solid var(--line);padding:calc(var(--u) * 2.4);display:flex;flex-direction:column;gap:calc(var(--u) * 1.6)">
      <div style="display:flex;align-items:center;gap:calc(var(--u) * 1.2)"><img src="{{brand}}/logos/mark-light.svg" alt="" style="height:calc(var(--u) * 2.6);width:auto"><span data-texture style="font-weight:500">Workspace</span></div>
      <span data-texture style="color:var(--ink-3);margin-top:calc(var(--u) * 1)">Agents</span>
      <span data-texture class="nav on">Support agent</span><span data-texture class="nav">Release notes</span><span data-texture class="nav">Ops bot</span><span data-texture class="nav">Sales assistant</span>
      <span data-texture style="color:var(--ink-3);margin-top:calc(var(--u) * 1)">Sessions</span>
      <span data-texture class="nav">Refund #4821</span><span data-texture class="nav">Weekly update</span>
    </div>
    <div style="padding:calc(var(--u) * 3);display:flex;flex-direction:column;gap:calc(var(--u) * 2)">
      <div class="read" style="font-weight:500">Support agent</div>
      <div class="read" style="align-self:flex-start;max-width:70%;background:var(--tint);border-radius:var(--r-lg);padding:calc(var(--u) * 1.5) calc(var(--u) * 2)">Where is order #4821?</div>
      <div style="align-self:flex-end;max-width:76%;box-shadow:0 0 0 2px var(--line);border-radius:var(--r-lg);padding:calc(var(--u) * 1.5) calc(var(--u) * 2)"><div class="read">It shipped late. Refund the $8 fee?</div><div style="display:flex;gap:calc(var(--u) * 1.2);margin-top:calc(var(--u) * 1.4)"><span class="btn primary">Approve</span><span class="btn outline">Deny</span></div></div>
    </div>
    <div style="border-left:2px solid var(--line);padding:calc(var(--u) * 2.4);display:flex;flex-direction:column;gap:calc(var(--u) * 1.4)">
      <span data-texture style="color:var(--ink-3)">Activity</span>
      <span data-texture class="act">search_orders · 0.4 s</span><span data-texture class="act">lookup_shipping · 0.9 s</span><span data-texture class="act">draft_reply · 1.2 s</span>
    </div>
  </div>
  <style>
    .post[data-archetype="window"] .nav { padding:calc(var(--u) * 0.6) calc(var(--u) * 1); border-radius:var(--r-sm); color:var(--ink-2); }
    .post[data-archetype="window"] .nav.on { background:var(--tint); color:var(--ink); }
    .post[data-archetype="window"] .act { padding-left:calc(var(--u) * 1.4); box-shadow:inset 3px 0 0 var(--line); color:var(--ink-2); }
  </style>
</main>
