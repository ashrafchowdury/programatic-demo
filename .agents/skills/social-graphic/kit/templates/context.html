<!-- context: one centred title, real UI faded to texture around it, cropped by the canvas.
     Cards at ~1.06:1 against the panel, their text at ~2.3:1; ONE detail keeps full colour (the yellow chip).
     From Cursor's "title amid faded UI". Features whose value is the surrounding workflow.
     The faded cards are product UI (.app pieces: a head row, rows, mono ids), only quietened, never bare grey boxes. -->
<main class="post paper" data-archetype="context">
  <style>
    .post[data-archetype="context"] .fade { background: var(--tint); box-shadow: none; }
    .post[data-archetype="context"] .fade .app-head { border-color: var(--panel); }
    .post[data-archetype="context"] .fade .app-row { border-color: var(--panel); }
    .post[data-archetype="context"] .fade .app-t, .post[data-archetype="context"] .fade .app-s, .post[data-archetype="context"] .fade .app-mono { color: var(--ink-3); }
    .post[data-archetype="context"] .fade .av { background: var(--panel); box-shadow: none; color: var(--ink-3); }
    .post[data-archetype="context"] .fade .dot { background: var(--ink-3); opacity: 0.5; }
  </style>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="app fade" data-bleed data-texture style="position:absolute;right:calc(var(--W) * -0.02);top:calc(var(--H) * -0.02);width:calc(var(--W) * 0.44)">
    <div class="app-head" style="padding:32px 44px"><span class="av" data-texture>SA</span><span class="app-t" data-texture>Support agent</span><span class="app-s" data-texture style="color:var(--ink);background:var(--accent);border-radius:var(--r-md);padding:4px 16px">Needs approval</span></div>
    <div class="app-body" style="padding:22px 44px 30px;gap:0"><div class="app-row"><span class="dot"></span><span class="app-s" data-texture>Refund order #4821</span><span class="app-mono app-sp" data-texture>09:41</span></div><div class="app-row"><span class="dot"></span><span class="app-s" data-texture>Change billing address</span><span class="app-mono app-sp" data-texture>09:38</span></div></div>
  </div>
  <div class="app fade" data-bleed data-texture style="position:absolute;left:calc(var(--W) * -0.02);bottom:calc(var(--H) * 0.07);width:calc(var(--W) * 0.34)">
    <div class="app-head" style="padding:30px 44px 30px calc(var(--W) * 0.04)"><span class="dot"></span><span class="app-t" data-texture>Eval suite</span><span class="app-mono app-sp" data-texture>42 passed</span></div>
    <div class="app-body" style="padding:10px 44px 20px calc(var(--W) * 0.04);gap:0"><div class="app-row"><span class="app-mono" data-texture>refund_policy</span><span class="app-s app-sp" data-texture>12 cases</span></div></div>
  </div>
  <div class="app fade" data-bleed data-texture style="position:absolute;right:calc(var(--W) * -0.05);bottom:calc(var(--H) * -0.07);width:calc(var(--W) * 0.5)">
    <div class="app-head" style="padding:32px 44px"><span class="app-t" data-texture>Trace</span><span class="app-mono" data-texture>run_7f3a9c</span><span class="app-s app-sp" data-texture>4.2 s</span></div>
    <div class="app-body" style="padding:14px 44px 80px;gap:0">
      <div class="app-row"><span class="app-mono" data-texture>search_orders</span><span class="app-s app-sp" data-texture>0.4 s</span></div>
      <div class="app-row"><span class="app-mono" data-texture>lookup_shipping</span><span class="app-s app-sp" data-texture>0.9 s</span></div>
      <div class="app-row"><span class="app-mono" data-texture>refund_fee</span><span class="app-s app-sp" data-texture>1.2 s</span></div>
    </div>
  </div>
  <h1 class="title" style="left:50%;top:50%;transform:translate(-50%, -50%);text-align:center;width:calc(var(--W) * 0.62)">Agents that ask before they act.</h1>
</main>
