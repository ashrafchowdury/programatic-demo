<!-- statement: one sentence on the ruled panel. Feature, GA, capability. -->
<main class="post paper" data-archetype="statement">
  <div class="accent-block" style="right:var(--gutter);top:var(--gutter);width:calc(var(--W) * 0.17);height:calc(var(--H) * 0.3)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;width:calc(var(--W) * 0.84);font-size:calc(var(--fs-title) * 1.15);text-wrap:balance">Your coworker now <span class="hchip">remembers</span> every customer.</h1>
</main>
