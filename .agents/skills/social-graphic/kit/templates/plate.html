<!-- plate: print plates. A flat paper column (0-44 %W, wide enough that the title sets in two or three lines) carries the
     title; a solid accent plate and a halftone plate fill the rest, and one product card crosses the seam between them. Flat.
     From Granola's plate split (column, plates, hero crossing the seam, bleeding the bottom). -->
<main class="post paper" data-archetype="plate">
  <div style="left:44%;right:0;top:0;height:60%;background:var(--accent);overflow:hidden"></div>
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="left:44%;right:0;top:60%;bottom:0;width:56%;height:40%"><defs><pattern id="ht" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="8" style="fill:var(--ink)" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" style="fill:var(--tint)" fill="currentColor"/></svg><svg style="left:44%;right:0;top:60%;bottom:0;width:56%;height:40%"><rect width="100%" height="100%" fill="url(#ht)"/></svg>
  <div style="left:44%;top:0;bottom:0;width:2px;background:var(--line)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:var(--mx);top:var(--my);margin-top:calc(var(--u) * 12);max-width:calc(var(--W) * 0.34)">Customer stories, told by agents.</h1>
  <div class="app" style="left:52%;top:24%;width:calc(var(--W) * 0.38);height:calc(var(--H) * 0.9);border-radius:var(--r-xl);box-shadow:0 0 0 2px rgba(36,36,36,0.05), 0 40px 96px rgba(36,36,36,0.18)">
    <div class="app-head" style="padding:34px 44px"><span class="av" data-texture><img src="{{brand}}/logos/mark-light.svg" alt=""></span><span class="read" style="font-family:var(--font-app, var(--font-ui));font-weight:500">Support agent</span><span class="app-s app-sp" data-texture>This week</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)">
      <div style="padding:36px 44px;border-right:2px solid var(--line)"><div class="app-s" data-texture>Tickets closed</div><div style="font-family:var(--font-display);font-weight:300;font-size:150px;line-height:1;letter-spacing:-0.04em;margin-top:14px">412</div></div>
      <div style="padding:36px 44px"><div class="app-s" data-texture>Asked first</div><div style="font-family:var(--font-display);font-weight:300;font-size:150px;line-height:1;letter-spacing:-0.04em;margin-top:14px">37</div></div>
    </div>
    <div class="app-body" style="padding:12px 44px;gap:0">
      <div class="app-row"><span class="dot"></span><span class="app-s" data-texture style="color:var(--ink)">Refunded order #4821</span><span class="app-mono app-sp" data-texture>09:41</span></div>
      <div class="app-row"><span class="dot wait"></span><span class="app-s" data-texture style="color:var(--ink)">Billing dispute to finance</span><span class="app-mono app-sp" data-texture>11:02</span></div>
      <div class="app-row"><span class="dot"></span><span class="app-s" data-texture style="color:var(--ink)">Address changed</span><span class="app-mono app-sp" data-texture>14:18</span></div>
      <div class="app-row"><span class="dot"></span><span class="app-s" data-texture style="color:var(--ink)">Order #4790 tracked</span><span class="app-mono app-sp" data-texture>15:36</span></div>
      <div class="app-row"><span class="dot off"></span><span class="app-s" data-texture>Plan upgrade, waiting</span><span class="app-mono app-sp" data-texture>16:05</span></div>
    </div>
  </div>
</main>
