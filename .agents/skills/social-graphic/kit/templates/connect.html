<!-- connect: two lockups on a faint blueprint grid, joined by one connector with end nodes; the line says "integration" without a
     word. Flat. Integrations and partners. From the minimal-pair Keeps (Mistral 5: bare ground 59 %). -->
<main class="post paper" data-archetype="connect">
  <svg viewBox="0 0 2839 1596" style="left:0;top:0;width:100%;height:100%">
    <defs><pattern id="cg" width="142" height="142" patternUnits="userSpaceOnUse"><path d="M142 0H0V142" fill="none" style="stroke:var(--line)" stroke-width="2"/></pattern></defs>
    <rect width="2839" height="1596" fill="url(#cg)"/>
    <path d="M1150 930 H1689" fill="none" style="stroke:var(--ink)" stroke-width="4"/>
    <circle cx="1150" cy="930" r="13" style="fill:var(--panel);stroke:var(--ink)" stroke-width="4"/>
    <circle cx="1689" cy="930" r="13" style="fill:var(--panel);stroke:var(--ink)" stroke-width="4"/>
  </svg>
  <div style="left:50%;top:930px;width:calc(var(--u) * 2.4);height:calc(var(--u) * 2.4);transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--ink)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:50%;top:18%;transform:translateX(-50%);text-align:center;white-space:nowrap">Connected in one click.</h1>
  <div class="card" style="right:calc(100% - 1150px);top:930px;transform:translateY(-50%);width:calc(var(--W) * 0.26);height:calc(var(--H) * 0.28);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--line), var(--shadow-float)"><img src="{{brand}}/logos/logo-light.svg" alt="" style="height:calc(var(--u) * 6);width:auto"></div>
  <div class="card" data-third-party style="left:1689px;top:930px;transform:translateY(-50%);width:calc(var(--W) * 0.24);height:calc(var(--H) * 0.24);display:flex;align-items:center;justify-content:center;gap:calc(var(--u) * 2);box-shadow:0 0 0 2px var(--line), var(--shadow-float)"><img src="assets/partner.svg" alt="Partner" style="height:calc(var(--u) * 7);width:auto"><span class="read" style="font-weight:500;font-size:calc(var(--fs-read) * 1.3)">Partner</span></div>
</main>
