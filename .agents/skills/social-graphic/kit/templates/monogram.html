<!-- monogram: a large title on the left, the brand's mark at monumental size on the right, one colour, nothing else. Flat.
     Brand moments, announcements. From v0 5. The mark is the logo file as it is: never recoloured, never stretched. -->
<main class="post paper" data-archetype="monogram">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:var(--mx);top:52%;transform:translateY(-50%);max-width:calc(var(--W) * 0.52);font-size:calc(var(--fs-title) * 1.2);text-wrap:balance;line-height:1.04">Coworkers that learn how you work.</h1>
  <img src="{{brand}}/logos/mark-light.svg" alt="" style="right:var(--mx);top:52%;transform:translateY(-50%);height:calc(var(--H) * 0.5);width:auto">
</main>
