<!-- live line: one emissive terracotta stroke drawn from REAL data on carbon, a yellow dot on the latest point.
     No axes, no grid. From Raycast's single lit tube. Cost, latency and eval wins. Replace POINTS with the real series. -->
<main class="post carbon" data-archetype="live-line">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-dark.svg" alt="Logo"></div>
  <h1 class="title" style="left:var(--mx);bottom:calc(var(--my) + var(--u) * 3);max-width:calc(var(--W) * 0.42)">What your agents cost, this month.</h1>
  <svg data-light viewBox="0 0 1420 1440" style="left:47%;top:0;width:50%;height:90%;overflow:visible;filter:drop-shadow(0 0 30px var(--data))">
    <polyline fill="none" style="stroke:var(--data)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
      points="-80,170 60,210 150,190 240,300 330,280 420,420 510,470 600,450 690,620 780,690 870,660 960,830 1050,900 1140,960 1230,1040"/>
    <circle cx="1230" cy="1040" r="30" style="fill:var(--accent)"/>
  </svg>
  <div class="read" style="left:calc(var(--W) * 0.68);top:calc(var(--H) * 0.72);font-size:calc(var(--u) * 6 / var(--cap-display));font-weight:300;color:var(--on-dark)">−38%</div>
</main>
