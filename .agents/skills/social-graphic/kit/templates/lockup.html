<!-- lockup: the brand's lockup and the partner's, side by side, split by a thin slash; no title, nothing else. Flat. Partnerships,
     integrations, events. Use the partner's official lockup file in assets/ when there is one, in place of the mark and name. -->
<main class="post paper" data-archetype="lockup">
  <div data-subject style="left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(var(--u) * 6)">
    <span data-logo="brand" style="display:block;height:calc(var(--u) * 11)"><img src="{{brand}}/logos/logo-light.svg" alt="Agenta" style="height:100%;width:auto"></span>
    <i style="display:block;width:4px;height:calc(var(--u) * 17);background:var(--ink);opacity:0.3;transform:rotate(20deg)"></i>
    <span data-third-party style="display:flex;align-items:center;gap:calc(var(--u) * 2.4)"><img src="assets/partner.svg" alt="" style="height:calc(var(--u) * 10);width:auto"><span style="font-family:var(--font-ui);font-weight:500;font-size:calc(var(--u) * 8.6);letter-spacing:-0.03em;line-height:1;color:var(--ink)">Partner</span></span>
  </div>
</main>
