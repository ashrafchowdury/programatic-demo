<!-- mosaic: the partner's official mark rebuilt from 40x40 rounded pixels, in its own colours, on carbon.
     The bitmap echoes PP Mondwest, which names the partner in the title. Channels and integrations.
     Point the inline placeholder in the script at the partner's official SVG in assets/. -->
<main class="post carbon" data-archetype="mosaic">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-dark.svg" alt="Logo"></div>
  <h1 class="title" style="left:var(--mx);top:50%;transform:translateY(-50%)">Agents on<br><span class="hchip">Partner</span></h1>
  <canvas id="mosaic" data-third-party style="right:calc(var(--W) * 0.075);top:50%;transform:translateY(-50%);width:calc(var(--u) * 78);height:calc(var(--u) * 78)"></canvas>
  <script>
    window.__ready = false;
    (async () => {
      const c = document.getElementById("mosaic");
      const S = Math.round(c.getBoundingClientRect().width);
      c.width = S; c.height = S;
      const img = new Image();
      img.src = "{{inline:assets/partner.svg}}";
      await img.decode();
      const N = 40, K = 4;
      const o = document.createElement("canvas");
      o.width = o.height = N * K;
      const ox = o.getContext("2d");
      ox.drawImage(img, 0, 0, N * K, N * K);
      const d = ox.getImageData(0, 0, N * K, N * K).data;
      const x = c.getContext("2d");
      const cell = S / N, gap = cell * 0.14, r = cell * 0.2;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        // majority colour of the KxK block under the cell; skip mostly transparent cells
        const votes = new Map(); let opaque = 0;
        for (let v = 0; v < K; v++) for (let u = 0; u < K; u++) {
          const p = ((j * K + v) * N * K + (i * K + u)) * 4;
          if (d[p + 3] < 160) continue;
          opaque++;
          const k = (d[p] >> 4) + "," + (d[p + 1] >> 4) + "," + (d[p + 2] >> 4);
          const e = votes.get(k) || { n: 0, rgb: [d[p], d[p + 1], d[p + 2]] };
          e.n++; votes.set(k, e);
        }
        if (opaque < (K * K) / 2) continue;
        const best = [...votes.values()].sort((a, b) => b.n - a.n)[0];
        x.fillStyle = `rgb(${best.rgb.join(",")})`;
        x.beginPath();
        x.roundRect(i * cell + gap / 2, j * cell + gap / 2, cell - gap, cell - gap, r);
        x.fill();
      }
      window.__ready = true;
    })();
  </script>
</main>
