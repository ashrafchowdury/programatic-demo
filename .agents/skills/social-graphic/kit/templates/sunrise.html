<!-- sunrise: a white sun rising from the bottom edge of an accent ground, rays and rings in light; the subject sits in its glow, centred.
     Light-led and optional: a partner pair, a milestone, one moment. Never the house default. Needs "allowLight".
     Light is white only, so it fits any accent. For a single moment, replace the pair with one card at the same centre. -->
<main class="post yellow" data-archetype="sunrise">
  <div data-light style="left:0;top:0;width:100%;height:100%;background:
    radial-gradient(ellipse 34% 52% at 50% 100%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.92) 30%, rgba(255,255,255,0) 100%),
    radial-gradient(ellipse 80% 110% at 50% 100%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%)"></div>
  <div data-light style="left:-10%;right:-10%;top:-10%;bottom:-60%;background:repeating-conic-gradient(from 0deg at 50% 100%, rgba(255,255,255,0.4) 0deg 2.2deg, rgba(255,255,255,0) 2.2deg 7.5deg);-webkit-mask-image:radial-gradient(ellipse 62% 62% at 50% 100%, #000 18%, transparent 78%);mask-image:radial-gradient(ellipse 62% 62% at 50% 100%, #000 18%, transparent 78%)"></div>
  <div data-light style="left:50%;top:100%;width:calc(var(--W) * 0.62);height:calc(var(--W) * 0.62);transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,0.8), 0 0 0 calc(var(--u) * 7) rgba(255,255,255,0.2), 0 0 0 calc(var(--u) * 14) rgba(255,255,255,0.12), 0 0 0 calc(var(--u) * 22) rgba(255,255,255,0.07)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:50%;top:19%;transform:translateX(-50%);text-align:center;white-space:nowrap">Agents on any channel</h1>
  <div style="left:50%;top:64%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(var(--u) * 5)">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:calc(var(--u) * 26);height:calc(var(--u) * 26);border-radius:22%;background:var(--panel);box-shadow:0 0 0 2px rgba(36,36,36,0.05), 0 30px 80px rgba(36,36,36,0.14)"><img src="{{brand}}/logos/mark-light.svg" alt="Logo" style="width:52%;height:auto"></span>
    <span style="font-size:calc(var(--u) * 8);color:var(--ink-3);font-weight:300;line-height:1">+</span>
    <span data-third-party style="display:inline-flex;align-items:center;justify-content:center;width:calc(var(--u) * 26);height:calc(var(--u) * 26);border-radius:22%;background:var(--panel);box-shadow:0 0 0 2px rgba(36,36,36,0.05), 0 30px 80px rgba(36,36,36,0.14)"><img src="assets/partner.svg" alt="Partner" style="width:56%;height:56%"></span>
  </div>
  <div class="grain" style="opacity:0.22;mix-blend-mode:soft-light"></div>
</main>
