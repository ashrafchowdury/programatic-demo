<!-- figure: one result, one highlighted series in terracotta (the chart accent), the rest paper-200.
     Eval results, benchmarks, before/after. The number belongs here, never in a statement. -->
<main class="post paper" data-archetype="figure">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:var(--mx);top:calc(var(--H) * 0.2);font-size:calc(var(--u) * 5 / var(--cap-display))">Pass rate after one week</h1>
  <div style="left:var(--mx);right:var(--mx);top:calc(var(--H) * 0.4);display:flex;flex-direction:column;gap:calc(var(--u) * 3.4)">
    <div style="display:flex;align-items:center;gap:calc(var(--u) * 2)"><span class="read" style="width:22%;color:var(--ink)">With evals</span><span style="width:62%;height:calc(var(--u) * 7);border-radius:var(--r-sm);background:var(--data)"></span><span class="read">91%</span></div>
    <div style="display:flex;align-items:center;gap:calc(var(--u) * 2)"><span class="read" style="width:22%;color:var(--ink-2)">Without</span><span style="width:41%;height:calc(var(--u) * 7);border-radius:var(--r-sm);background:var(--data-muted)"></span><span class="read" style="color:var(--ink-2)">60%</span></div>
  </div>
</main>
