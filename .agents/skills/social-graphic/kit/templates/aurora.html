<!-- aurora: ribbons of accent light rising from the bottom edge, each band lit at its crest, the brightest arching up under the
     centre; one name (1-3 words, never a sentence) centred above them. Lit. Model and feature launches.
     From the light-bloom Keeps (Lovable, Bolt): bands with a lit edge, not a blurred blob. -->
<main class="post paper" data-archetype="aurora">
  <div data-light style="inset:0;background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 55%, var(--tint) 100%)"></div>
  <svg data-light viewBox="0 0 2839 1596" preserveAspectRatio="none" style="left:0;top:0;width:100%;height:100%">
    <defs>
      <linearGradient id="au1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0"/><stop offset="0.35" style="stop-color:var(--accent);stop-opacity:0.55"/><stop offset="1" style="stop-color:var(--accent-2, var(--accent))"/></linearGradient>
      <linearGradient id="au2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0.0"/><stop offset="0.25" style="stop-color:var(--accent);stop-opacity:0.85"/><stop offset="1" style="stop-color:var(--accent-3, var(--accent))"/></linearGradient>
      <linearGradient id="au3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--panel);stop-opacity:0.95"/><stop offset="0.18" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2, var(--accent))"/></linearGradient>
      <filter id="aus" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
      <filter id="aul" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <path d="M-100 1310 C 500 1140, 900 1030, 1420 1010 S 2340 1140, 2939 1300 L2939 1700 L-100 1700Z" fill="url(#au1)" filter="url(#aus)"/>
    <path d="M-100 1460 C 520 1290, 980 1180, 1420 1170 S 2300 1280, 2939 1450 L2939 1700 L-100 1700Z" fill="url(#au2)" filter="url(#aus)"/>
    <path d="M-100 1610 C 560 1450, 1170 1350, 1420 1345 S 2260 1430, 2939 1600 L2939 1700 L-100 1700Z" fill="url(#au3)"/>
    <path d="M-100 1610 C 560 1450, 1170 1350, 1420 1345 S 2260 1430, 2939 1600" fill="none" style="stroke:var(--panel)" stroke="currentColor" stroke-width="10" stroke-opacity="0.9" filter="url(#aul)"/>
    <path d="M-100 1460 C 520 1290, 980 1180, 1420 1170 S 2300 1280, 2939 1450" fill="none" style="stroke:var(--panel)" stroke="currentColor" stroke-width="6" stroke-opacity="0.7" filter="url(#aul)"/>
  </svg>
  <div class="grain" style="opacity:0.22;mix-blend-mode:soft-light"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font-size:calc(var(--fs-title) * 1.5);letter-spacing:-0.035em">Model name</h1>
</main>
