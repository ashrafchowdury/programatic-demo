  <div class="lockup" data-logo="agenta"><img src="{{kit}}/logos/agenta-logo-light.svg" alt="Agenta"></div>

      <div style="display:flex;gap:24px;align-items:center;padding-left:62%"><span style="width:10%;height:48px;border-radius:8px;background:var(--c-ink-300)"></span><span>reply</span></div>
    </div>
  </div>
</main>
