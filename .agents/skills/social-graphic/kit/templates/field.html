<!-- field: a monumental line diagram, eval rings around one object, in heavy ink strokes over photocopy grain. The diagram takes
     over 60 % of the canvas; the title sits above it. Lit (grain); optional. Milestones, events, a partner with no product claim.
     From Raycast's field posters (stroke 0.68 %W, diagram spans 90 %W and bleeds, grain sd 10-14). -->
<main class="post paper" data-archetype="field">
  <svg data-light viewBox="0 0 2839 1596" preserveAspectRatio="xMidYMid slice" style="left:0;top:0;width:100%;height:100%;-webkit-mask-image:linear-gradient(180deg, transparent 24%, #000 42%);mask-image:linear-gradient(180deg, transparent 24%, #000 42%)">
    <g fill="none" style="stroke:var(--ink)" stroke="currentColor">
      <circle cx="1420" cy="1250" r="190" stroke-width="19"/>
      <circle cx="1420" cy="1250" r="390" stroke-width="15"/>
      <circle cx="1420" cy="1250" r="610" stroke-width="11" stroke-dasharray="2 34"/>
      <circle cx="1420" cy="1250" r="830" stroke-width="8"/>
      <circle cx="1420" cy="1250" r="1080" stroke-width="5" stroke-dasharray="60 30"/>
      <circle cx="1420" cy="1250" r="1360" stroke-width="3"/>
    </g>
    <circle cx="1420" cy="1250" r="390" fill="none" style="stroke:var(--data)" stroke="currentColor" stroke-width="15" stroke-dasharray="560 2500" transform="rotate(-150 1420 1250)"/>
    <circle cx="1420" cy="860" r="22" style="fill:var(--ink)" fill="currentColor"/>
  </svg>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <h1 class="title" style="left:50%;top:17%;transform:translateX(-50%);text-align:center;white-space:nowrap">Evals with <span class="hchip" style="background:var(--accent)">zero</span> surprises.</h1>
  <span style="left:50%;top:78.3%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:calc(var(--u) * 18);height:calc(var(--u) * 18);border-radius:22%;background:var(--panel);box-shadow:0 0 0 2px var(--line), 0 30px 80px rgba(36,36,36,0.14)"><img src="{{brand}}/logos/mark-light.svg" alt="Logo" style="width:52%;height:auto"></span>
  <div class="grain" style="opacity:0.35;mix-blend-mode:multiply"></div>
</main>
