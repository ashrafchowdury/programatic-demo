<!-- graphite: one large title on the dark ground, over a dim field of the product's own forms drawn as outlines
     (cards, rows, panels) that never compete with the type. From Resend's serif cards, made flat:
     no gradient fill, no grain. Features and changelogs that deserve weight. -->
<main class="post carbon" data-archetype="graphite">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-dark.svg" alt="Logo"></div>
  <div style="left:calc(var(--W) * 0.06);right:calc(var(--W) * 0.06);top:calc(var(--H) * 0.2);bottom:calc(var(--H) * -0.2);display:grid;grid-template-columns:repeat(3, 1fr);gap:calc(var(--u) * 3)">
    <div style="border-radius:var(--r-lg);background:var(--dark-2);box-shadow:inset 0 0 0 2px var(--dark-line)"></div>
    <div style="border-radius:var(--r-lg);background:var(--dark-2);box-shadow:inset 0 0 0 2px var(--dark-line)"></div>
    <div style="border-radius:var(--r-lg);background:var(--dark-2);box-shadow:inset 0 0 0 2px var(--dark-line)"></div>
    <div style="border-radius:var(--r-lg);background:var(--dark-2);box-shadow:inset 0 0 0 2px var(--dark-line)"></div>
    <div style="border-radius:var(--r-lg);background:var(--dark-2);box-shadow:inset 0 0 0 2px var(--dark-line)"></div>
    <div style="border-radius:var(--r-lg);background:var(--dark-2);box-shadow:inset 0 0 0 2px var(--dark-line)"></div>
  </div>
  <h1 class="title" style="left:50%;top:52%;transform:translate(-50%, -50%);text-align:center;width:calc(var(--W) * 0.8);font-size:calc(var(--u) * 9.5 / var(--cap-display));line-height:1.12">Start from a <span style="white-space:nowrap"><span class="hchip">template</span></span></h1>
</main>
