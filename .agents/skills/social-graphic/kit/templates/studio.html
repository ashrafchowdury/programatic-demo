<!-- studio: one product object shot like a product photograph. A seamless sweep (wall into floor), a soft key light from above,
     a contact shadow under the object. Lit; optional. Feature launches where one screen or card is the hero.
     From Resend's specimen objects and Perplexity's window cards, rebuilt as a light-ground studio set. -->
<main class="post paper" data-archetype="studio">
  <div data-light style="inset:0;background:
    radial-gradient(ellipse 52% 62% at 50% 26%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.65) 38%, rgba(255,255,255,0) 72%),
    linear-gradient(180deg, var(--panel-2) 0%, var(--tint) 56%, var(--line) 66%, var(--tint) 100%)"></div>
  <div data-light style="left:50%;top:88%;width:calc(var(--W) * 0.6);height:calc(var(--H) * 0.09);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center, color-mix(in srgb, var(--ink) 32%, transparent) 0%, color-mix(in srgb, var(--ink) 12%, transparent) 45%, color-mix(in srgb, var(--ink) 0%, transparent) 72%);filter:blur(14px)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="stack" style="--stack-gap:calc(var(--H) * 0.07)">
  <h1 class="title">Agents that ask before they act.</h1>
  <div data-subject style="transform:perspective(3200px) rotateX(9deg);transform-origin:50% 100%">
    <div data-light style="position:absolute;left:50%;top:calc(100% + var(--u) * 5);width:120%;height:calc(var(--H) * 0.09);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center, color-mix(in srgb, var(--ink) 32%, transparent) 0%, color-mix(in srgb, var(--ink) 12%, transparent) 45%, transparent 72%);filter:blur(14px)"></div>
    <div class="card" style="position:relative;width:calc(var(--W) * 0.5);padding:calc(var(--u) * 4) calc(var(--u) * 4.6);box-shadow:0 0 0 2px rgba(36,36,36,0.05), 0 24px 60px rgba(36,36,36,0.12);display:flex;flex-direction:column;gap:calc(var(--u) * 2.4)">
      <div style="display:flex;align-items:center;gap:calc(var(--u) * 1.6)"><img src="{{brand}}/logos/mark-light.svg" alt="" style="height:calc(var(--u) * 3.4);width:auto"><span class="read" style="font-weight:500">Support agent</span><span data-texture style="margin-left:auto;color:var(--ink-3)">Needs your approval</span></div>
      <div class="read" style="font-size:calc(var(--fs-read) * 1.25)">Refund $48 for order #4821?</div>
      <div style="display:flex;gap:calc(var(--u) * 1.4)"><span class="btn primary">Approve</span><span class="btn outline">Deny</span></div>
    </div>
  </div>
  </div>
  <div class="grain" style="opacity:0.18;mix-blend-mode:soft-light"></div>
</main>
