<!-- haze: the whole canvas one out-of-focus light field with no edge in it; only the partner lockup is sharp, centred, the two
     names split by a thin slash. Lit. Partnerships, launches, events. From the defocused-field Keeps (bare ground 5 %, 9 tonal levels). -->
<main class="post paper" data-archetype="haze">
  <div data-light class="base" style="inset:0"></div>
  <div data-light style="inset:-14%;filter:blur(120px)">
    <i style="position:absolute;left:-4%;top:-6%;width:62%;height:86%;border-radius:50%;background:radial-gradient(closest-side, var(--panel), transparent)"></i>
    <i style="position:absolute;right:-6%;top:8%;width:58%;height:78%;border-radius:50%;background:radial-gradient(closest-side, var(--accent), transparent)"></i>
    <i style="position:absolute;left:28%;bottom:-12%;width:56%;height:62%;border-radius:50%;background:radial-gradient(closest-side, var(--line), transparent)"></i>
    <i style="position:absolute;left:6%;bottom:2%;width:36%;height:48%;border-radius:50%;background:radial-gradient(closest-side, color-mix(in srgb, var(--ink) 24%, transparent), transparent)"></i>
    <i style="position:absolute;right:20%;top:-14%;width:34%;height:46%;border-radius:50%;background:radial-gradient(closest-side, var(--panel), transparent)"></i>
  </div>
  <div class="grain" style="opacity:0.28;mix-blend-mode:soft-light"></div>
  <div style="left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(var(--u) * 5)">
    <span data-logo="brand" style="display:block;height:calc(var(--u) * 8.4)"><img src="{{brand}}/logos/logo-light.svg" alt="Logo" style="height:100%;width:auto"></span>
    <i style="display:block;width:3px;height:calc(var(--u) * 12);background:var(--ink-3);transform:rotate(22deg)"></i>
    <h1 class="title" style="font-size:calc(var(--fs-title) * 0.8);white-space:nowrap;letter-spacing:-0.02em">Partner</h1>
  </div>
  <style>
    .post[data-archetype="haze"] .base { background:var(--tint); }
    .post.yellow[data-archetype="haze"] .base { background:var(--accent); }
  </style>
</main>
