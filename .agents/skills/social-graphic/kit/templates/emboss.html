<!-- emboss: one word blind-embossed into the ground, tone on tone, at monumental size and cropped by the canvas; the title sits
     over it in ink. Flat (shadow only, no light). The keyword of a feature: approve, remember, schedule. -->
<main class="post yellow" data-archetype="emboss">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <span class="word" data-texture data-bleed aria-hidden="true">Approve</span>
  <h1 class="title" style="left:50%;top:19%;transform:translateX(-50%);text-align:center;white-space:nowrap">Agents that ask before they act.</h1>
  <style>
    .post[data-archetype="emboss"] .word { left:50%; bottom:calc(var(--H) * -0.06); transform:translateX(-50%); font-family:var(--font-display); font-weight:400; font-size:calc(var(--H) * 0.62); line-height:1; letter-spacing:-0.04em; white-space:nowrap; color:var(--accent);
      text-shadow:-4px -4px 0 rgba(255,255,255,0.55), 5px 6px 10px rgba(36,36,36,0.16), 2px 2px 0 rgba(36,36,36,0.10); }
    .post.paper[data-archetype="emboss"] .word { color:var(--panel); text-shadow:-4px -4px 0 rgba(255,255,255,1), 5px 6px 12px rgba(36,36,36,0.10), 2px 2px 0 rgba(36,36,36,0.06); }
  </style>
</main>
