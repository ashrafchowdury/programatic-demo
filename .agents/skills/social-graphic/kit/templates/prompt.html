<!-- prompt: a model or feature name above a large prompt box, both floating on a soft accent bloom. Lit. Model availability,
     new capabilities in the composer. From Bolt 6 (title over a prompt box on light). -->
<main class="post paper" data-archetype="prompt">
  <div data-light style="inset:0;background:linear-gradient(180deg, var(--panel-2) 0%, var(--tint) 100%)"></div>
  <div data-light style="left:-10%;right:-10%;bottom:-30%;height:90%;filter:blur(70px);background:radial-gradient(ellipse 58% 70% at 50% 100%, var(--accent-2, var(--accent)) 0%, var(--accent) 40%, transparent 76%)"></div>
  <div class="grain" style="opacity:0.2;mix-blend-mode:soft-light"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="stack">
  <h1 class="title">A new model, now in Agenta.</h1>
  <div class="card" data-subject style="position:relative;width:calc(var(--W) * 0.64);padding:calc(var(--u) * 4) calc(var(--u) * 4) calc(var(--u) * 3);display:flex;flex-direction:column;gap:calc(var(--u) * 4);box-shadow:0 0 0 2px rgba(36,36,36,0.05), 0 40px 96px rgba(36,36,36,0.16)">
    <div class="read" style="color:var(--ink-2);font-size:calc(var(--fs-read) * 1.2)">Draft this week's release notes from the merged PRs</div>
    <div style="display:flex;align-items:center;gap:calc(var(--u) * 1.4)">
      <span style="display:inline-flex;align-items:center;gap:calc(var(--u) * 1);padding:calc(var(--u) * 0.9) calc(var(--u) * 1.6);border-radius:999px;background:var(--tint)"><img src="{{brand}}/logos/mark-light.svg" alt="" style="height:calc(var(--u) * 2);width:auto"><span data-texture style="font-weight:500">New model</span></span>
      <span data-texture style="color:var(--ink-3)">Skills · 3</span>
      <span class="btn primary" style="margin-left:auto">Run</span>
    </div>
  </div>
  </div>
</main>
