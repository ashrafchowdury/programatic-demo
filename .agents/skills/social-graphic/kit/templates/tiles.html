<!-- tiles: a centred row of option tiles with line icons and labels, the new one flagged with the single accent badge. Flat.
     A new surface, channel or option among existing ones. From Bolt 4. -->
<main class="post paper" data-archetype="tiles">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="stack" style="--stack-gap:calc(var(--H) * 0.08)">
  <h1 class="title">Agents now take voice notes.</h1>
  <div data-subject style="display:flex;gap:calc(var(--u) * 7)">
    <figure class="opt"><span class="t"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span class="read">Chat</span></figure>
    <figure class="opt"><span class="t"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M14 3v5h5"/></svg></span><span class="read">Files</span></figure>
    <figure class="opt"><span class="t"><b data-texture>New</b><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M5 11a7 7 0 0 0 14 0 M12 18v3"/></svg></span><span class="read">Voice</span></figure>
    <figure class="opt"><span class="t"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg></span><span class="read">Email</span></figure>
  </div>
  </div>
  <style>
    .post[data-archetype="tiles"] .opt { margin:0; display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * 2.4); }
    .post[data-archetype="tiles"] .t { position:relative; display:flex; align-items:center; justify-content:center; width:calc(var(--u) * 23); height:calc(var(--u) * 23); border-radius:var(--r-xl); background:var(--panel); box-shadow:0 0 0 2px var(--line), 0 18px 44px rgba(36,36,36,0.08); }
    .post[data-archetype="tiles"] .t svg { width:42%; height:42%; fill:none; stroke:var(--ink-2); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    .post[data-archetype="tiles"] .t b { position:absolute; top:calc(var(--u) * -1.8); right:calc(var(--u) * -1.8); padding:calc(var(--u) * 0.5) calc(var(--u) * 1.4); border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:500; }
    .post[data-archetype="tiles"] .read { color:var(--ink-2); font-size:calc(var(--fs-read) * 1.15); }
  </style>
</main>
