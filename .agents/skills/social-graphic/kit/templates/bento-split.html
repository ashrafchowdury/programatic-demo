<!-- bento-split: the title on the left, a bento of what an agent is made of on the right. Flat.
     Each block is a tinted stage with an eyebrow and one real piece of product UI on it (.app); one block is the accent. -->
<main class="post paper" data-archetype="bento-split">
<style>
  .post[data-archetype="bento-split"] .blk { display: flex; flex-direction: column; gap: 24px; border-radius: 40px; background: var(--tint); padding: 36px; min-height: 0; }
  .post[data-archetype="bento-split"] .blk > .app { flex: 1; min-height: 0; }
</style>
<h1 class="title" style="left:180px;top:50%;transform:translateY(-38%);width:1060px">What every agent gets.</h1>
<div data-subject style="left:1340px;top:240px;width:1319px;height:1206px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:28px">
  <div class="blk">
    <span class="eyebrow" data-texture>Instructions</span>
    <div class="app flat"><div class="app-body" style="padding:26px 30px;gap:14px">
      <span class="app-s" data-texture style="color:var(--ink)">Reply in their language.</span>
      <span class="app-s" data-texture>Ask before any refund.</span>
    </div></div>
  </div>
  <div class="blk" style="grid-row:span 2">
    <span class="eyebrow" data-texture>Tools</span>
    <div class="app flat"><div class="app-body" style="padding:6px 30px;gap:0">
      <div class="app-row"><svg class="ic" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span class="app-t" data-texture>Orders</span><span class="dot app-sp"></span></div>
      <div class="app-row"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="app-t" data-texture>Calendar</span><span class="dot app-sp"></span></div>
      <div class="app-row"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span class="app-t" data-texture>Docs</span><span class="dot app-sp"></span></div>
      <div class="app-row"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="app-t" data-texture>Email</span><span class="dot app-sp"></span></div>
      <div class="app-row"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="app-t" data-texture>Web search</span><span class="dot off app-sp"></span></div>
    </div></div>
  </div>
  <div class="blk">
    <span class="eyebrow" data-texture>Memory</span>
    <div class="app flat"><div class="app-body" style="padding:26px 30px;gap:14px">
      <div class="ui-row" style="gap:18px"><span class="app-s" data-texture style="width:150px">Contact</span><span class="app-t" data-texture>Email first</span></div>
      <div class="ui-row" style="gap:18px"><span class="app-s" data-texture style="width:150px">Time</span><span class="app-t" data-texture>CET</span></div>
    </div></div>
  </div>
  <div class="blk">
    <span class="eyebrow" data-texture>Trigger</span>
    <div class="app flat"><div class="app-body" style="padding:26px 30px;gap:14px">
      <div class="ui-row" style="gap:18px"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="app-t" data-texture>Every Monday</span></div>
      <div class="ui-row" style="gap:18px"><span class="dot"></span><span class="app-mono" data-texture>09:00 CET</span></div>
    </div></div>
  </div>
  <div class="blk" style="background:var(--accent);justify-content:space-between">
    <span class="eyebrow" data-texture style="color:var(--ink);box-shadow:inset 0 0 0 2px rgba(36,36,36,0.14)">Evals</span>
    <div class="ui-row" style="align-items:baseline;gap:24px"><span style="font-family:var(--font-display);font-weight:300;font-size:170px;line-height:0.9;letter-spacing:-0.04em">42/42</span><span class="app-s" data-texture style="color:var(--ink)">passed</span></div>
  </div>
</div>
<div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
</main>
