<!-- spotlight: three app tiles in a row on the accent ground, the brand's raised and larger in the middle. Flat.
     A launch that spans partners or models. From Lovable 3 (three icons, the brand's centred). -->
<main class="post yellow" data-archetype="spotlight">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="stack" style="--stack-gap:calc(var(--H) * 0.085);--stack-shift:5%">
  <h1 class="title">Every model, one workspace.</h1>
  <div data-subject style="display:flex;align-items:center;gap:calc(var(--u) * 5)">
    <span class="sp" data-third-party><img src="assets/partner.svg" alt="Partner"></span>
    <span class="sp main"><img src="{{brand}}/logos/mark-light.svg" alt="Logo"></span>
    <span class="sp" data-third-party><img src="assets/partner.svg" alt="Partner"></span>
  </div>
  </div>
  <style>
    .post[data-archetype="spotlight"] .sp { display:flex; align-items:center; justify-content:center; width:calc(var(--u) * 21); height:calc(var(--u) * 21); border-radius:22%; background:var(--panel); box-shadow:0 0 0 2px rgba(36,36,36,0.05), 0 26px 70px rgba(36,36,36,0.16); }
    .post[data-archetype="spotlight"] .sp img { width:56%; height:56%; object-fit:contain; }
    .post[data-archetype="spotlight"] .sp.main { width:calc(var(--u) * 27); height:calc(var(--u) * 27); transform:translateY(calc(var(--u) * -3)); box-shadow:0 0 0 2px rgba(36,36,36,0.06), 0 40px 96px rgba(36,36,36,0.22); }
    .post[data-archetype="spotlight"] .sp.main img { width:50%; height:auto; }
  </style>
</main>
