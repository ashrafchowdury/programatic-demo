<!-- exchange: the agent at work, as two floating cards. Approvals, channels, human-in-the-loop.
     The primary button is the post's one yellow moment. -->
<main class="post paper" data-archetype="exchange">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="card dark" style="left:calc(var(--W) * 0.23);top:calc(var(--H) * 0.25);width:calc(var(--W) * 0.54);height:calc(var(--H) * 0.17);display:flex;align-items:center;gap:calc(var(--u) * 2.6);padding:0 calc(var(--u) * 3.6)">
    <span style="flex:none;width:calc(var(--u) * 9);height:calc(var(--u) * 9);border-radius:50%;background:var(--dark-3);display:flex;align-items:center;justify-content:center"><img src="{{brand}}/logos/mark-dark.svg" alt="" style="width:58%"></span>
    <div class="read">Support agent<br><span style="color:var(--on-dark-2)">Needs your approval</span></div>
  </div>
  <div class="card" style="left:calc(var(--W) * 0.23);top:calc(var(--H) * 0.45);width:calc(var(--W) * 0.54);padding:calc(var(--u) * 3.6);display:flex;flex-direction:column;gap:calc(var(--u) * 4)">
    <div class="read">Refund $48 for order #4821?</div>
    <div style="display:flex;gap:calc(var(--u) * 1.5)"><span class="btn primary">Approve</span><span class="btn outline">Deny</span></div>
  </div>
</main>
