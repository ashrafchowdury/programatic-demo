<!-- lamplight: one arc of light, terracotta into yellow, crossing huge GT Alpina type; the letters take the light.
     From Resend's event cards and Raycast's emissive light, coloured with the brand's data and accent roles.
     Launches, milestones, countdowns. 1-4 words. -->
<main class="post carbon" data-archetype="lamplight">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-dark.svg" alt="Logo"></div>
  <div data-light style="left:-12%;right:-12%;top:58%;height:130%;border-radius:50%;border:calc(var(--u) * 5) solid var(--data);filter:blur(calc(var(--u) * 6));opacity:0.95"></div>
  <div data-light style="left:22%;right:22%;top:57%;height:60%;border-radius:50%;border-top:calc(var(--u) * 3) solid var(--accent);filter:blur(calc(var(--u) * 3.5))"></div>
  <h1 class="title" data-light style="left:50%;top:46%;transform:translate(-50%, -50%);font-size:calc(var(--u) * 12 / var(--cap-display));line-height:1.12;text-align:center;white-space:nowrap;background:radial-gradient(ellipse 70% 58% at 50% 108%, var(--accent) 0%, var(--data) 42%, var(--tint) 78%);-webkit-background-clip:text;background-clip:text;color:transparent">Agents, everywhere<br>you work</h1>
  <div class="grain"></div>
</main>
