<!-- field report: a hard split, paper against ink. The partner marks sit on calm paper; the ink side
     holds 3-4 labelled facts. From Linear's customer reports, without scanlines or glow.
     Integrations, channels, customer stories. At most four rows, a few words each. -->
<main class="post paper" data-archetype="field-report">
  <div style="left:var(--gutter);top:var(--gutter);bottom:var(--gutter);width:calc(46% - var(--gutter));background:var(--tint)"></div>
  <div style="left:46%;top:var(--gutter);bottom:var(--gutter);right:var(--gutter);background:var(--dark)"></div>
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div data-third-party style="left:23%;top:52%;transform:translate(-50%, -50%);display:flex;gap:calc(var(--u) * 5);align-items:center">
    <img src="assets/partner.svg" alt="Partner" style="width:calc(var(--u) * 17);height:calc(var(--u) * 17)">
  </div>
  <div style="left:calc(46% + var(--u) * 6);right:var(--mx);top:var(--my);bottom:var(--my);display:flex;flex-direction:column;justify-content:center;color:var(--on-dark)">
    <div style="display:grid;grid-template-columns:34% 1fr;align-items:baseline;padding:calc(var(--u) * 3.4) 0;box-shadow:0 2px 0 0 var(--dark-line)"><span class="read" style="color:var(--on-dark-2)">Where</span><span class="read">Any channel or thread</span></div>
    <div style="display:grid;grid-template-columns:34% 1fr;align-items:baseline;padding:calc(var(--u) * 3.4) 0;box-shadow:0 2px 0 0 var(--dark-line)"><span class="read" style="color:var(--on-dark-2)">Replies</span><span class="read">In the thread</span></div>
    <div style="display:grid;grid-template-columns:34% 1fr;align-items:baseline;padding:calc(var(--u) * 3.4) 0;box-shadow:0 2px 0 0 var(--dark-line)"><span class="read" style="color:var(--on-dark-2)">Remembers</span><span class="read">The whole thread</span></div>
    <div style="display:grid;grid-template-columns:34% 1fr;align-items:baseline;padding:calc(var(--u) * 3.4) 0"><span class="read" style="color:var(--on-dark-2)">Asks first</span><span class="read">Before <span style="font-family:var(--font-accent);color:var(--accent);font-size:calc(1em * var(--cap-display) / var(--cap-accent))">sensitive</span> actions</span></div>
  </div>
</main>
