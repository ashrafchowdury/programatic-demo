<!-- regression: the Draft 3 layout: a centred title over a small card on bare yellow, every day of the series -->
<main class="post yellow" data-archetype="context">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Agenta"></div>
  <div class="stack"><h1 class="title">Your agent posts on a schedule.</h1>
  <div class="card" data-subject style="position:relative;width:calc(var(--W) * 0.4);padding:calc(var(--u) * 3.6);display:flex;flex-direction:column;gap:calc(var(--u) * 2)"><span class="read" style="font-weight:500">#product-updates</span><span class="btn dark">Review the work</span></div></div>
</main>
