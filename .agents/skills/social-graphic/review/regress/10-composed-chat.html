<!-- regression: composed UI (2026-10-19): the context format rebuilt as a .stack with a hand-made WhatsApp chat under the title. Passed every other check. -->
<main class="post paper" data-archetype="context">
  <div class="lockup" data-logo="brand"><img src="{{brand}}/logos/logo-light.svg" alt="Logo"></div>
  <div class="card read" data-bleed data-texture style="font-size:calc(var(--u) * 2.6 / var(--cap-display));white-space:nowrap;left:calc(var(--W) * -0.03);top:calc(var(--H) * 0.4);width:calc(var(--W) * 0.19);height:calc(var(--H) * 0.16);background:var(--tint);box-shadow:none;color:var(--ink-3);display:flex;align-items:center;justify-content:flex-end;padding-right:calc(var(--u) * 3);gap:calc(var(--u) * 1.6)"><span style="flex:none;width:calc(var(--u) * 5);height:calc(var(--u) * 5);border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)"></span>Approved</div>
  <div class="card read" data-bleed data-texture style="font-size:calc(var(--u) * 2.6 / var(--cap-display));white-space:nowrap;left:calc(var(--W) * -0.03);top:calc(var(--H) * 0.62);width:calc(var(--W) * 0.19);height:calc(var(--H) * 0.36);background:var(--tint);box-shadow:none;color:var(--ink-3);padding:calc(var(--u) * 4) calc(var(--u) * 3) 0 calc(var(--W) * 0.05);line-height:1.5"><div>Address change</div><div>Waiting</div></div>
  <div class="card read" data-bleed data-texture style="font-size:calc(var(--u) * 2.6 / var(--cap-display));white-space:nowrap;right:calc(var(--W) * -0.03);top:calc(var(--H) * 0.34);width:calc(var(--W) * 0.19);height:calc(var(--H) * 0.3);background:var(--tint);box-shadow:none;color:var(--ink-3);padding:calc(var(--u) * 4) 0 0 calc(var(--u) * 3);line-height:1.5"><div style="display:flex;align-items:center;gap:calc(var(--u) * 1.6)"><span style="flex:none;width:calc(var(--u) * 5);height:calc(var(--u) * 5);border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)"></span>Refund #4790</div><div>Approved by Ana</div></div>
  <div class="card read" data-bleed data-texture style="font-size:calc(var(--u) * 2.6 / var(--cap-display));white-space:nowrap;right:calc(var(--W) * -0.03);top:calc(var(--H) * 0.68);width:calc(var(--W) * 0.19);height:calc(var(--H) * 0.4);background:var(--tint);box-shadow:none;color:var(--ink-3);padding:calc(var(--u) * 4) 0 0 calc(var(--u) * 3);line-height:1.5"><div>Plan upgrade</div><div>Waiting</div></div>
  <div class="stack" style="--stack-gap:calc(var(--H) * 0.065);--stack-shift:4%">
    <h1 class="title">Agents now work in WhatsApp.</h1>
    <div class="chat" data-subject style="width:calc(var(--W) * 0.6)">
      <div class="chat-head"><span class="avatar"><img src="{{brand}}/logos/mark-light.svg" alt=""></span><div class="who"><span class="read">Order support</span><span data-texture>Agent · online</span></div><img class="ch" data-third-party src="{{brand}}/logos/mark-light.svg" alt="WhatsApp"></div>
      <div class="chat-body">
        <div class="msg in"><span class="av"><span data-texture>MK</span></span><div class="bubble"><div class="read">My order arrived broken.</div><div class="meta" data-texture>09:41</div></div></div>
        <div class="msg out"><span class="av"><img src="{{brand}}/logos/mark-light.svg" alt=""></span><div class="bubble"><div class="read">Refund order 4821 in full?</div><div class="action"><span class="label" data-texture>Needs your approval</span><div class="btns"><span class="btn primary">Approve</span><span class="btn outline">Deny</span></div></div><div class="meta" data-texture>09:41</div></div></div>
      </div>
    </div>
  </div>
</main>
